# Publication automatique d'une version.
# À chaque envoi sur « main », lit le numéro de version dans installer/ClasseControle.iss
# (#define AppVersion). Si la version GitHub « vX.Y.Z » n'existe pas encore, construit
# sur Windows l'application unique, la version portable et l'installateur (Inno Setup),
# puis crée la version avec tous les fichiers à télécharger.
# Pour publier une nouvelle version : changer AppVersion, puis envoyer sur main.
name: Publier une version

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publier:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lire la version et vérifier si elle est déjà publiée
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Select-String -Path installer\ClasseControle.iss -Pattern '#define AppVersion "([^"]+)"').Matches[0].Groups[1].Value
          "tag=v$v" >> $env:GITHUB_OUTPUT
          gh release view "v$v" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) { "exists=true" >> $env:GITHUB_OUTPUT; Write-Host "v$v est déjà publiée : rien à faire." }
          else { "exists=false" >> $env:GITHUB_OUTPUT; Write-Host "Publication de v$v." }
          exit 0

      - uses: actions/setup-dotnet@v4
        if: steps.version.outputs.exists != 'true'
        with:
          dotnet-version: '8.0.x'

      - name: Installer Inno Setup si absent
        if: steps.version.outputs.exists != 'true'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      # Construit les deux .exe puis l'installateur. En cas d'échec de l'installateur,
      # la version est quand même publiée avec les .exe et le journal de construction.
      # Signature de code (contre SmartScreen et l'erreur 4551) : active si un certificat est
      # configuré dans les secrets du dépôt (Settings → Secrets and variables → Actions).
      # Voir installer/sign.ps1 :
      #   • certificat .pfx : CC_SIGN_PFX_BASE64 + CC_SIGN_PFX_PASSWORD ;
      #   • Azure Trusted Signing : CC_TS_ENDPOINT, CC_TS_ACCOUNT, CC_TS_PROFILE,
      #     AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET.
      # Sans secret : construction non signée, comme avant.
      - name: Construire exécutables et installateur
        if: steps.version.outputs.exists != 'true'
        id: build
        continue-on-error: true
        shell: pwsh
        env:
          CC_SIGN_PFX_BASE64: ${{ secrets.CC_SIGN_PFX_BASE64 }}
          CC_SIGN_PFX_PASSWORD: ${{ secrets.CC_SIGN_PFX_PASSWORD }}
          CC_TS_ENDPOINT: ${{ secrets.CC_TS_ENDPOINT }}
          CC_TS_ACCOUNT: ${{ secrets.CC_TS_ACCOUNT }}
          CC_TS_PROFILE: ${{ secrets.CC_TS_PROFILE }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          powershell -ExecutionPolicy Bypass -File installer\build.ps1 *>&1 | Tee-Object -FilePath build-log.txt
          if (-not (Get-ChildItem publish\installer\*.exe -ErrorAction SilentlyContinue)) { throw "Installateur non produit" }

      - name: Préparer les fichiers
        if: steps.version.outputs.exists != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out, portable\ClasseControle | Out-Null
          # Fichier unique (compatibilité avec les mises à jour des postes en 1.10 à 1.12).
          Copy-Item publish\single\ClasseControle.exe out\
          # Version portable = programme + bibliothèques (aussi utilisée par la mise à jour automatique).
          Copy-Item publish\app\*.exe, publish\app\*.dll, dist\GUIDE.txt portable\ClasseControle\
          Compress-Archive -Path portable\ClasseControle -DestinationPath out\ClasseControle-portable.zip
          $setup = Get-ChildItem publish\installer\*.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($setup) { Copy-Item $setup.FullName out\ClasseControle-Setup.exe }
          else { Copy-Item build-log.txt out\build-log.txt -ErrorAction SilentlyContinue }
          # Empreintes SHA-256 : permettent au service informatique d'autoriser les fichiers
          # (règle « par hachage » de WDAC / AppLocker / Intune) tant qu'ils ne sont pas signés.
          Get-ChildItem out -File | Where-Object Name -ne 'SHA256SUMS.txt' | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content out\SHA256SUMS.txt -Encoding ascii
          # État de la signature, visible dans le journal de la construction.
          Get-ChildItem out\*.exe | ForEach-Object {
            $sig = Get-AuthenticodeSignature $_.FullName
            Write-Host ("{0} : {1} {2}" -f $_.Name, $sig.Status, $sig.SignerCertificate.Subject)
          }
          Get-ChildItem out

      - name: Créer la version GitHub
        if: github.event_name == 'push' && steps.version.outputs.exists != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $files = Get-ChildItem out | ForEach-Object { $_.FullName }
          gh release create $tag @files --target "${{ github.sha }}" --title "Classe_controle $($tag.TrimStart('v'))" --notes-file .github/release-notes.md --latest

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: classecontrole
          path: out/*
