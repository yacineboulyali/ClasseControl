# Publication automatique d'une version.
# À chaque envoi sur « main », lit le numéro de version dans installer/ClasseControle.iss
# (#define AppVersion). Si la version GitHub « vX.Y.Z » n'existe pas encore, construit
# sur Windows l'application unique, la version portable et l'installateur (Inno Setup),
# puis crée la version avec tous les fichiers à télécharger.
# Pour publier une nouvelle version : changer AppVersion, puis envoyer sur main.
name: Publier une version

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      essai:
        description: "Publier une VERSION D'ESSAI (pré-version, ignorée par la mise à jour automatique)"
        type: boolean
        default: true

permissions:
  contents: write
  actions: read   # SignPath lit les fichiers à signer envoyés par actions/upload-artifact

jobs:
  publier:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lire la version et vérifier si elle est déjà publiée
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ("${{ github.event_name }}" -eq 'workflow_dispatch' -and "${{ inputs.essai }}" -eq 'true') {
            # Version d'essai : toujours construite, publiée en pré-version avec un nom daté.
            "tag=essai-$(Get-Date -Format 'yyyyMMdd-HHmm')" >> $env:GITHUB_OUTPUT
            "exists=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $v = (Select-String -Path installer\ClasseControle.iss -Pattern '#define AppVersion "([^"]+)"').Matches[0].Groups[1].Value
          "tag=v$v" >> $env:GITHUB_OUTPUT
          gh release view "v$v" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) { "exists=true" >> $env:GITHUB_OUTPUT; Write-Host "v$v est déjà publiée : rien à faire." }
          else { "exists=false" >> $env:GITHUB_OUTPUT; Write-Host "Publication de v$v." }
          exit 0

      - uses: actions/setup-dotnet@v4
        if: steps.version.outputs.exists != 'true'
        with:
          dotnet-version: '8.0.x'

      - name: Installer Inno Setup si absent
        if: steps.version.outputs.exists != 'true'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      # Signature de code (contre Smart App Control, SmartScreen et l'erreur 4551).
      # Deux possibilités, choisies selon ce qui est configuré dans le dépôt
      # (Settings → Secrets and variables → Actions) :
      #   • SignPath Foundation (gratuit, projets open source) : variable SIGNPATH_ORGANIZATION_ID
      #     + secret SIGNPATH_API_TOKEN — voir installer/signpath/LISEZMOI.md ;
      #   • certificat .pfx ou Azure Trusted Signing : voir installer/sign.ps1.
      # Sans rien de configuré : construction non signée, comme avant.
      - name: Construire le programme
        if: steps.version.outputs.exists != 'true'
        shell: pwsh
        env:
          CC_SIGN_PFX_BASE64: ${{ secrets.CC_SIGN_PFX_BASE64 }}
          CC_SIGN_PFX_PASSWORD: ${{ secrets.CC_SIGN_PFX_PASSWORD }}
          CC_TS_ENDPOINT: ${{ secrets.CC_TS_ENDPOINT }}
          CC_TS_ACCOUNT: ${{ secrets.CC_TS_ACCOUNT }}
          CC_TS_PROFILE: ${{ secrets.CC_TS_PROFILE }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          powershell -ExecutionPolicy Bypass -File installer\build.ps1 -Stage app *>&1 | Tee-Object -FilePath build-log.txt
          if (-not (Test-Path publish\app\ClasseControle.exe)) { throw "Programme non produit" }

      # --- SignPath : 1) ClasseControle.exe (version installée + fichier unique) ---
      - name: Envoyer le programme à signer (SignPath)
        id: programme-a-signer
        if: steps.version.outputs.exists != 'true' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: programme-a-signer
          path: |
            publish/app/ClasseControle.exe
            publish/single/ClasseControle.exe
          if-no-files-found: error

      - name: Signer le programme (SignPath)
        if: steps.version.outputs.exists != 'true' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'ClasseControl' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: programme
          github-artifact-id: ${{ steps.programme-a-signer.outputs.artifact-id }}
          wait-for-completion: true
          # La politique « release-signing » demande une approbation manuelle sur signpath.io.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signe/programme

      - name: Remplacer par le programme signé
        if: steps.version.outputs.exists != 'true' && vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: pwsh
        run: |
          foreach ($d in 'app', 'single') {
            $src = Get-ChildItem signe\programme -Recurse -Filter ClasseControle.exe | Where-Object { $_.Directory.Name -eq $d } | Select-Object -First 1
            if (-not $src) { throw "ClasseControle.exe signé introuvable ($d)" }
            $sig = Get-AuthenticodeSignature $src.FullName
            if ($sig.Status -ne 'Valid') { throw "Signature invalide ($d) : $($sig.Status)" }
            Copy-Item $src.FullName "publish\$d\ClasseControle.exe" -Force
            Write-Host "$d : signé par $($sig.SignerCertificate.Subject)"
          }

      # En cas d'échec de l'installateur, la version est quand même publiée avec les .exe et
      # le journal de construction.
      - name: Construire l'installateur
        if: steps.version.outputs.exists != 'true'
        id: build
        continue-on-error: true
        shell: pwsh
        env:
          CC_SIGN_PFX_BASE64: ${{ secrets.CC_SIGN_PFX_BASE64 }}
          CC_SIGN_PFX_PASSWORD: ${{ secrets.CC_SIGN_PFX_PASSWORD }}
          CC_TS_ENDPOINT: ${{ secrets.CC_TS_ENDPOINT }}
          CC_TS_ACCOUNT: ${{ secrets.CC_TS_ACCOUNT }}
          CC_TS_PROFILE: ${{ secrets.CC_TS_PROFILE }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          powershell -ExecutionPolicy Bypass -File installer\build.ps1 -Stage installer *>&1 | Tee-Object -FilePath build-log.txt -Append
          if (-not (Get-ChildItem publish\installer\*.exe -ErrorAction SilentlyContinue)) { throw "Installateur non produit" }

      # --- SignPath : 2) l'installateur ---
      - name: Envoyer l'installateur à signer (SignPath)
        id: installateur-a-signer
        if: steps.version.outputs.exists != 'true' && vars.SIGNPATH_ORGANIZATION_ID != '' && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: installateur-a-signer
          path: publish/installer/*.exe
          if-no-files-found: error

      - name: Signer l'installateur (SignPath)
        if: steps.version.outputs.exists != 'true' && vars.SIGNPATH_ORGANIZATION_ID != '' && steps.build.outcome == 'success'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'ClasseControl' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: installateur
          github-artifact-id: ${{ steps.installateur-a-signer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signe/installateur

      - name: Remplacer par l'installateur signé
        if: steps.version.outputs.exists != 'true' && vars.SIGNPATH_ORGANIZATION_ID != '' && steps.build.outcome == 'success'
        shell: pwsh
        run: |
          $src = Get-ChildItem signe\installateur -Recurse -Filter *.exe | Select-Object -First 1
          if (-not $src) { throw "Installateur signé introuvable" }
          $sig = Get-AuthenticodeSignature $src.FullName
          if ($sig.Status -ne 'Valid') { throw "Signature invalide de l'installateur : $($sig.Status)" }
          Copy-Item $src.FullName (Join-Path publish\installer $src.Name) -Force

      - name: Préparer les fichiers
        if: steps.version.outputs.exists != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out, portable\ClasseControle | Out-Null
          # Fichier unique (compatibilité avec les mises à jour des postes en 1.10 à 1.12).
          Copy-Item publish\single\ClasseControle.exe out\
          # Version portable = programme + bibliothèques (aussi utilisée par la mise à jour automatique).
          Copy-Item publish\app\*.exe, publish\app\*.dll, dist\GUIDE.txt portable\ClasseControle\
          Compress-Archive -Path portable\ClasseControle -DestinationPath out\ClasseControle-portable.zip
          $setup = Get-ChildItem publish\installer\*.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($setup) { Copy-Item $setup.FullName out\ClasseControle-Setup.exe }
          else { Copy-Item build-log.txt out\build-log.txt -ErrorAction SilentlyContinue }
          # Empreintes SHA-256 : permettent au service informatique d'autoriser les fichiers
          # (règle « par hachage » de WDAC / AppLocker / Intune) tant qu'ils ne sont pas signés.
          Get-ChildItem out -File | Where-Object Name -ne 'SHA256SUMS.txt' | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content out\SHA256SUMS.txt -Encoding ascii
          # État de la signature, visible dans le journal de la construction.
          Get-ChildItem out\*.exe | ForEach-Object {
            $sig = Get-AuthenticodeSignature $_.FullName
            Write-Host ("{0} : {1} {2}" -f $_.Name, $sig.Status, $sig.SignerCertificate.Subject)
          }
          Get-ChildItem out

      - name: Créer la version GitHub
        if: github.event_name == 'push' && steps.version.outputs.exists != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $files = Get-ChildItem out | ForEach-Object { $_.FullName }
          gh release create $tag @files --target "${{ github.sha }}" --title "Classe_controle $($tag.TrimStart('v'))" --notes-file .github/release-notes.md --latest

      # Version d'essai : pré-version GitHub. Elle n'est jamais « latest » : la mise à jour
      # automatique des postes (releases/latest) ne la voit pas.
      - name: Créer la version d'essai (pré-version)
        if: github.event_name == 'workflow_dispatch' && inputs.essai
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $files = Get-ChildItem out | ForEach-Object { $_.FullName }
          gh release create $tag @files --target "${{ github.sha }}" --prerelease --latest=false `
            --title "Version d'essai ($($tag.Substring(6)))" --notes-file .github/release-notes-essai.md

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: classecontrole
          path: out/*
